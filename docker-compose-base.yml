name: aio-agent-platform-base

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aio_agent_platform
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    # 仅绑定本机回环：这些是内部服务，不应直接暴露到公网。
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d aio_agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infra-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infra-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - infra-network

  sandbox-build:
    build:
      context: ./backend/sandbox
      dockerfile: Dockerfile
    image: crpi-yvha9coypdedaafa.cn-beijing.personal.cr.aliyuncs.com/lys1313013/aio-agent-platform-sandbox:latest
    profiles: ["build"]

volumes:
  pgdata:
    # Preserve the volume name used before the infrastructure project was split.
    name: ${POSTGRES_VOLUME_NAME:-aio-agent-platform_pgdata}
  minio_data:
    name: ${MINIO_VOLUME_NAME:-aio-agent-platform_minio_data}

networks:
  infra-network:
    name: ${INFRA_NETWORK_NAME:-aio-agent-platform-infra}
    driver: bridge
