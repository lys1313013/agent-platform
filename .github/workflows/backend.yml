name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_user
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: agent_platform_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U agent_user -d agent_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src/

      - name: Prepare disposable room test database
        run: |
          uv run python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect(
                  "postgresql://agent_user:changeme@localhost:5435/agent_platform_test"
              )
              try:
                  await conn.execute("CREATE DATABASE room_test")
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://agent_user:changeme@localhost:5435/agent_platform_test
          ROOM_TEST_DATABASE_URL: postgresql+asyncpg://agent_user:changeme@localhost:5435/room_test
        run: uv run pytest --run-postgres --cov=src --cov-report=xml

  sandbox-security:
    needs: test
    runs-on: ubuntu-latest
    env:
      ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
      ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build sandbox for security checks
        uses: docker/build-push-action@v7
        with:
          context: backend/sandbox
          platforms: linux/${{ matrix.arch }}
          pull: true
          no-cache: true
          load: true
          provenance: false
          sbom: false
          tags: local/agent-platform-sandbox:security-check

      - name: Smoke test sandbox document dependencies
        run: |
          docker run --rm -i --platform linux/${{ matrix.arch }} \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /workspace:rw,size=256m,uid=1000,gid=1000 \
            --tmpfs /tmp:rw,size=64m,uid=1000,gid=1000 \
            local/agent-platform-sandbox:security-check python - < backend/sandbox/smoke_test.py

      - name: Install checksum-verified vulnerability scanner
        env:
          GRYPE_VERSION: '0.121.3'
          GRYPE_SHA256: e9da18cc1429e786722e32161288103600efffd8e483c90761f90485bd1bec85
        run: |
          archive="${RUNNER_TEMP}/grype.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${GRYPE_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" grype

      - name: Reject fixable high and critical sandbox vulnerabilities
        run: |
          "${RUNNER_TEMP}/grype" docker:local/agent-platform-sandbox:security-check \
            --platform linux/${{ matrix.arch }} --only-fixed --fail-on high \
            --output json --file sandbox-security.json

      - name: Upload sandbox vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-security-${{ matrix.arch }}
          path: sandbox-security.json
          if-no-files-found: warn

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Push the verified sandbox candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}-sandbox
          ACR_IMAGE: ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.ALIYUN_ACR_NAMESPACE }}/agent-platform-sandbox
          CANDIDATE_TAG: ${{ github.sha }}-${{ matrix.arch }}
        run: |
          for image in "$GHCR_IMAGE" "$ACR_IMAGE"; do
            docker tag local/agent-platform-sandbox:security-check "${image}:${CANDIDATE_TAG}"
            docker push "${image}:${CANDIDATE_TAG}"
          done

  build-and-push:
    needs: [test, sandbox-security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
      ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          # buildkit 默认生成 OCI attestation(provenance/sbom) manifest,
          # 阿里云 ACR 个人版不支持(unknown manifest class ...empty.v1+json),
          # 显式关闭以兼容双 registry 推送
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository }}-backend:latest
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.ALIYUN_ACR_NAMESPACE }}/agent-platform-backend:latest
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.ALIYUN_ACR_NAMESPACE }}/agent-platform-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Promote exactly the images checked above, without rebuilding dependencies.
      # Docker manifest lists stay compatible with ACR's lack of OCI attestations.
      - name: Publish verified multi-platform sandbox image
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}-sandbox
          ACR_IMAGE: ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.ALIYUN_ACR_NAMESPACE }}/agent-platform-sandbox
        run: |
          for image in "$GHCR_IMAGE" "$ACR_IMAGE"; do
            docker buildx imagetools create \
              --tag "${image}:${GITHUB_SHA}" --tag "${image}:latest" \
              "${image}:${GITHUB_SHA}-amd64" "${image}:${GITHUB_SHA}-arm64"
          done
